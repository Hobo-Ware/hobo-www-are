<!doctype html>
<html lang="%paraglide.lang%" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="author" content="Hoboware" />

		%hobo.icons%

		<script>
			(function () {
				var root = document.documentElement;
				var stored = null;
				try {
					stored = localStorage.getItem('hobo-theme');
				} catch (e) {}
				root.dataset.theme = stored === 'light' ? 'light' : 'dark';
				var hash = location.hash.slice(1);
				var day = new Date().getDay();
				root.dataset.mode =
					hash === 'weekday' || hash === 'weekend'
						? hash
						: day === 0 || day === 6
							? 'weekend'
							: 'weekday';
				document.querySelectorAll('[data-weekday][data-weekend]').forEach(function (el) {
					el.setAttribute(
						el.tagName === 'META' ? 'content' : 'href',
						el.getAttribute('data-' + root.dataset.mode)
					);
				});
			})();
		</script>
		%hobo.fonts% %hobo.jsonld% %sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
