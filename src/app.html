<!doctype html>
<html lang="%paraglide.lang%" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="author" content="Hoboware" />

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/light/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon/light/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon/light/favicon-16x16.png"
		/>

		<script>
			(function () {
				var root = document.documentElement;
				var stored = null;
				try {
					stored = localStorage.getItem('hobo-theme');
				} catch (e) {}
				root.dataset.theme = stored === 'light' ? 'light' : 'dark';
				var hash = location.hash.slice(1);
				var day = new Date().getDay();
				root.dataset.mode =
					hash === 'weekday' || hash === 'weekend'
						? hash
						: day === 0 || day === 6
							? 'weekend'
							: 'weekday';
			})();
		</script>
		%hobo.fonts% %hobo.jsonld% %sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
